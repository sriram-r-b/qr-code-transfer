<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Receive Data - QR Data Transfer</title>
<script src="/static/qrcode.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f13; color: #e0e0e0; height: 100vh; overflow: hidden; }
.container { height: 100vh; display: flex; flex-direction: column; }
.top-bar { display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1.5rem; background: #1a1a24; border-bottom: 1px solid #2a2a3a; flex-shrink: 0; }
.back { background: #2a2a3a; border: none; color: #e0e0e0; padding: 0.4rem 0.8rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
.back:hover { background: #3a3a4a; }
h1 { font-size: 1.2rem; background: linear-gradient(135deg, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.status { margin-left: auto; font-size: 0.8rem; display: flex; align-items: center; gap: 0.5rem; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; display: none; }
.status-dot.active { display: block; animation: blink 1.2s infinite; }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

.camera-area { flex: 1; min-height: 0; position: relative; background: #000; overflow: hidden; }
#recvVideo { width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); }
#recvCanvas { display: none; }
.scan-overlay {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  border: 3px solid rgba(99,102,241,0.3); pointer-events: none;
  transition: border-color 0.1s;
}
.scan-overlay.hit { border-color: rgba(34,197,94,0.7); }
.scan-corners { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
.sc { position: absolute; width: 24px; height: 24px; border-color: #6366f1; border-style: solid; }
.sc.tl { top: 12px; left: 12px; border-width: 2px 0 0 2px; }
.sc.tr { top: 12px; right: 12px; border-width: 2px 2px 0 0; }
.sc.bl { bottom: 12px; left: 12px; border-width: 0 0 2px 2px; }
.sc.br { bottom: 12px; right: 12px; border-width: 0 2px 2px 0; }
.scan-line {
  position: absolute; left: 8%; width: 84%; height: 2px;
  background: linear-gradient(90deg, transparent, #6366f1, transparent);
  animation: scanSweep 2.5s ease-in-out infinite;
  pointer-events: none;
}
@keyframes scanSweep { 0%,100% { top: 8%; } 50% { top: 92%; } }

.ack-qr-container {
  position: absolute; inset: 0;
  background: #fff; padding: min(5vmin, 36px); border-radius: 0;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  z-index: 12; display: none; align-items: center; justify-content: center;
}
.ack-qr-container canvas, .ack-qr-container img {
  display: block;
  width: min(86vw, calc(100vh - 180px), 900px);
  height: min(86vw, calc(100vh - 180px), 900px);
  image-rendering: pixelated;
}
.ack-label {
  position: absolute; bottom: calc(100% + 8px); left: 12px; right: 12px;
  text-align: center; background: rgba(99,102,241,0.92);
  color: #fff; font-size: 0.65rem; padding: 4px 8px; border-radius: 3px;
  font-weight: 700; letter-spacing: 0.03em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.bottom-bar { padding: 0.6rem 1.5rem; background: #1a1a24; border-top: 1px solid #2a2a3a; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; flex-shrink: 0; }
.progress-row { display: flex; align-items: center; gap: 0.75rem; flex: 1; min-width: 200px; }
.progress-bar { flex: 1; height: 6px; background: #2a2a3a; border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #6366f1, #22c55e); border-radius: 3px; transition: width 0.2s; width: 0%; }
.progress-text { font-size: 0.8rem; color: #888; min-width: 5rem; }
.btn { padding: 0.35rem 0.8rem; border-radius: 0.35rem; border: none; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: all 0.15s; }
.btn-primary { background: #6366f1; color: #fff; }
.btn-primary:hover { background: #5558e6; }
.btn-primary:disabled { background: #3a3a5a; cursor: not-allowed; }
.btn-secondary { background: #2a2a3a; color: #e0e0e0; }
.btn-secondary:hover { background: #3a3a4a; }
.btn-success { background: #22c55e; color: #fff; }
.btn-success:hover { background: #16a34a; }

.chunk-dots { display: flex; gap: 3px; flex-wrap: wrap; align-items: center; }
.cdot { width: 14px; height: 14px; border-radius: 3px; background: #2a2a3a; transition: background 0.2s; }
.cdot.have { background: #22c55e; }
.cdot.miss { background: #ef4444; animation: blink 1s infinite; }

.log-line { font-family: monospace; font-size: 0.7rem; color: #666; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.debug-panel {
  position: absolute; left: 12px; bottom: 12px; z-index: 11;
  width: min(620px, calc(100vw - 24px)); max-height: 34vh; overflow: auto;
  background: rgba(8,8,12,0.84); border: 1px solid rgba(99,102,241,0.35);
  border-radius: 6px; padding: 8px 10px; font-family: monospace;
  font-size: 0.68rem; color: #b8c0ff; white-space: pre-wrap;
}

.output-card { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #0f0f13; z-index: 20; display: none; flex-direction: column; padding: 1.5rem; }
.output-card.open { display: flex; }
.output-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
.output-header h2 { font-size: 1.1rem; }
.output-text { flex: 1; background: #12121c; border: 1px solid #2a2a3a; border-radius: 0.5rem; padding: 0.75rem; color: #e0e0e0; font-size: 0.9rem; font-family: inherit; resize: none; outline: none; overflow: auto; }
.output-footer { margin-top: 0.75rem; display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
.verify-hash { font-family: monospace; font-size: 0.75rem; color: #666; }
.verify-hash.match { color: #22c55e; }
.verify-hash.mismatch { color: #ef4444; }
.hidden { display: none !important; }

.start-overlay {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.7); z-index: 5;
}
.start-overlay .icon { font-size: 3rem; margin-bottom: 1rem; }
.start-overlay .msg { color: #888; margin-bottom: 1.5rem; font-size: 0.95rem; }
</style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <a href="/" class="back">&larr; Back</a>
    <h1>Receive Data</h1>
    <div class="status">
      <span id="recvStatusText">Waiting</span>
      <span class="status-dot" id="recvDot"></span>
    </div>
  </div>

  <div class="camera-area" id="cameraArea">
    <video id="recvVideo" autoplay playsinline muted></video>
    <canvas id="recvCanvas"></canvas>
    <div class="scan-overlay" id="scanOverlay">
      <div class="scan-corners">
        <span class="sc tl"></span><span class="sc tr"></span>
        <span class="sc bl"></span><span class="sc br"></span>
      </div>
      <div class="scan-line"></div>
    </div>

    <div class="ack-qr-container" id="ackContainer">
      <div id="ackQR"></div>
      <div class="ack-label">ACK</div>
    </div>
    <pre class="debug-panel" id="debugPanel"></pre>

    <div class="start-overlay" id="startOverlay">
      <div class="icon">&#128247;</div>
      <div class="msg">Point your camera at the sender's screen</div>
      <button class="btn btn-primary" id="startBtn">&#9654; Start Camera</button>
    </div>

    <div class="output-card" id="outputCard">
      <div class="output-header">
        <h2>Received Data</h2>
        <button class="btn btn-secondary" id="closeOutputBtn">&times;</button>
      </div>
      <textarea class="output-text" id="outputText" readonly></textarea>
      <div class="output-footer">
        <button class="btn btn-success" id="copyBtn">Copy</button>
        <button class="btn btn-success hidden" id="downloadBtn">Download</button>
        <span class="verify-hash" id="verifyHash"></span>
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="progress-row">
      <span class="progress-text" id="progressText">0 / 0</span>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="chunk-dots" id="recvDots"></div>
    <span class="log-line" id="logLine"></span>
  </div>
</div>

<script src="/static/jsqr.js"></script>
<script>
const CHUNK_SIZE = 80;

const recvVideo = document.getElementById('recvVideo');
const recvCanvas = document.getElementById('recvCanvas');
const scanOverlay = document.getElementById('scanOverlay');
const startOverlay = document.getElementById('startOverlay');
const startBtn = document.getElementById('startBtn');
const recvStatusText = document.getElementById('recvStatusText');
const recvDot = document.getElementById('recvDot');
const progressText = document.getElementById('progressText');
const progressFill = document.getElementById('progressFill');
const recvDots = document.getElementById('recvDots');
const logLine = document.getElementById('logLine');
const outputCard = document.getElementById('outputCard');
const outputText = document.getElementById('outputText');
const verifyHash = document.getElementById('verifyHash');
const copyBtn = document.getElementById('copyBtn');
const downloadBtn = document.getElementById('downloadBtn');
const closeOutputBtn = document.getElementById('closeOutputBtn');
const ackQR = document.getElementById('ackQR');
const ackContainer = document.getElementById('ackContainer');
const ackLabel = document.querySelector('.ack-label');
const debugPanel = document.getElementById('debugPanel');

let stream = null;
let scanning = false;
let animId = null;

let received = {};
let sessionHash = null;
let totalChunks = null;
let contiguousIdx = -1;
let ackQrInstance = null;
let scanAttempts = 0;
let scanErrors = 0;
let decodeHits = 0;
let lastFrameLog = 0;
let lastNoCodeLog = 0;
let lastScanStats = 0;
let barcodeDetector = null;
let barcodeDetecting = false;

function debugLog(level, message, details = null) {
  const line = '[' + new Date().toLocaleTimeString() + '] ' + level.toUpperCase() + ' ' + message +
    (details === null ? '' : ' ' + JSON.stringify(details));
  console[level === 'error' ? 'error' : level === 'warn' ? 'warn' : 'log']('[receive]', message, details || '');
  debugPanel.textContent = (line + '\n' + debugPanel.textContent).slice(0, 6000);
  fetch('/client-log', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ page: 'receive', level, message, details })
  }).catch(() => {});
}

window.addEventListener('error', event => {
  debugLog('error', 'window error', {
    message: event.message,
    source: event.filename,
    line: event.lineno,
    column: event.colno
  });
});

window.addEventListener('unhandledrejection', event => {
  debugLog('error', 'unhandled promise rejection', {
    reason: String(event.reason && event.reason.message ? event.reason.message : event.reason)
  });
});

debugLog('info', 'receiver page loaded', {
  jsQR: typeof jsQR,
  QRCode: typeof QRCode,
  BarcodeDetector: typeof BarcodeDetector,
  userAgent: navigator.userAgent,
  secureContext: window.isSecureContext
});

if ('BarcodeDetector' in window) {
  try {
    barcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });
    debugLog('info', 'native BarcodeDetector enabled');
  } catch (e) {
    debugLog('warn', 'native BarcodeDetector unavailable', { message: e.message });
  }
}

function setStatus(text, dot = false) {
  recvStatusText.textContent = text;
  if (dot) recvDot.classList.add('active');
  else recvDot.classList.remove('active');
}

function log(msg) {
  logLine.textContent = msg;
  debugLog('info', msg);
}

function flashOverlay() {
  scanOverlay.classList.add('hit');
  clearTimeout(scanOverlay._flash);
  scanOverlay._flash = setTimeout(() => scanOverlay.classList.remove('hit'), 150);
}

function computeContiguous() {
  let i = 0;
  while (received[i] !== undefined) i++;
  return i - 1;
}

let lastDrawnAck = -1;
function updateACK() {
  if (contiguousIdx === lastDrawnAck) {
    ackContainer.style.display = 'flex';
    return;
  }
  lastDrawnAck = contiguousIdx;

  if (!ackQrInstance) {
    ackQR.innerHTML = '';
    ackQrInstance = new QRCode(ackQR, {
      width: 900, height: 900,
      colorDark: '#000000', colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.L
    });
  }
  const payload = JSON.stringify({
    v: 1, t: 'a', h: sessionHash, i: contiguousIdx
  });
  ackQrInstance.clear();
  ackQrInstance.makeCode(payload);
  ackContainer.style.display = 'flex';
  ackLabel.textContent = 'ACK CHUNK ' + (contiguousIdx + 1);
  debugLog('info', 'ACK QR displayed', {
    chunkAcked: contiguousIdx + 1,
    sessionHash: sessionHash?.slice(0, 16),
    payloadLength: payload.length
  });
}

function updateProgress() {
  const count = Object.keys(received).length;
  progressText.textContent = contiguousIdx + 1 + ' / ' + (totalChunks || '?');
  const pct = totalChunks ? ((contiguousIdx + 1) / totalChunks * 100) : 0;
  progressFill.style.width = Math.min(pct, 100) + '%';

  recvDots.innerHTML = '';
  if (!totalChunks) return;
  for (let i = 0; i < totalChunks; i++) {
    const d = document.createElement('div');
    d.className = 'cdot';
    if (received[i] !== undefined) d.classList.add('have');
    d.classList.toggle('miss', received[i] === undefined && sessionHash !== null);
    recvDots.appendChild(d);
  }
}

function processData(raw) {
  let msg;
  debugLog('info', 'decoded raw QR payload', {
    length: raw.length,
    preview: raw.slice(0, 160)
  });
  try { msg = JSON.parse(raw); } catch (e) {
    debugLog('warn', 'decoded QR is not JSON', { error: e.message, preview: raw.slice(0, 160) });
    return;
  }
  if (msg.v !== 1 || msg.t !== 'd') {
    debugLog('warn', 'decoded QR is not a data chunk', { v: msg.v, t: msg.t });
    return;
  }
  if (!msg.h || msg.i === undefined || !msg.d) {
    debugLog('warn', 'decoded data chunk missing required fields', Object.keys(msg));
    return;
  }

  // Check for session change
  if (sessionHash && msg.h !== sessionHash) {
    log('Ignoring chunk from different session');
    return;
  }

  if (!sessionHash) {
    sessionHash = msg.h;
    totalChunks = msg.n;
    setStatus('Receiving', true);
    log('Started: ' + totalChunks + ' chunks');
  }

  if (received[msg.i] !== undefined) {
    flashOverlay();
    if (contiguousIdx >= 0) updateACK();
    updateProgress();
    return;
  }

  received[msg.i] = msg.d;
  flashOverlay();

  const newContiguous = computeContiguous();
  if (newContiguous > contiguousIdx) {
    contiguousIdx = newContiguous;
    updateACK();
    setStatus('Chunk ' + (contiguousIdx + 1) + '/' + totalChunks, true);
    log('Got chunk ' + (msg.i + 1) + ' — contiguous: ' + (contiguousIdx + 1));
  } else {
    log('Got chunk ' + (msg.i + 1) + ' (out of order, contiguous: ' + (contiguousIdx + 1) + ')');
  }

  updateProgress();

  if (contiguousIdx === totalChunks - 1) {
    reassemble();
  }
}

function reassemble() {
  setStatus('Complete!', false);
  log('All chunks received — reassembling');
  stopCamera();

  const sorted = [];
  for (let i = 0; i < totalChunks; i++) {
    if (received[i] === undefined) {
      log('Missing chunk ' + (i + 1) + ' — incomplete');
      return;
    }
    sorted.push(received[i]);
  }

  try {
    const raw = atob(sorted.join(''));
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);

    let text;
    try {
      text = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
    } catch {
      text = '[Binary data: ' + raw.length + ' bytes — use download]';
    }

    outputText.value = text;
    outputCard.classList.add('open');
    progressFill.style.width = '100%';
    verifyData(bytes);
  } catch (e) {
    log('Reassembly error: ' + e.message);
  }
}

async function verifyData(bytes) {
  try {
    const hashBuf = await crypto.subtle.digest('SHA-256', bytes);
    const hashArr = Array.from(new Uint8Array(hashBuf));
    const hashHex = hashArr.map(b => b.toString(16).padStart(2, '0')).join('');
    const match = hashHex === sessionHash;
    verifyHash.textContent = (match ? 'Verified' : 'MISMATCH');
    verifyHash.className = 'verify-hash ' + (match ? 'match' : 'mismatch');
  } catch {
    verifyHash.textContent = 'Verification unavailable';
  }
}

copyBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(outputText.value).then(() => log('Copied'));
});

closeOutputBtn.addEventListener('click', () => {
  outputCard.classList.remove('open');
});

ackContainer.addEventListener('click', () => {
  ackContainer.style.display = 'none';
  lastDrawnAck = -1; // Force redraw next time a chunk arrives if needed
});

startBtn.addEventListener('click', startCamera);

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment',
        width: { ideal: 1280 },
        height: { ideal: 720 },
        advanced: [{ focusMode: 'continuous' }]
      }
    });
    recvVideo.srcObject = stream;
    await recvVideo.play();
    const track = stream.getVideoTracks()[0];
    debugLog('info', 'camera started', {
      videoWidth: recvVideo.videoWidth,
      videoHeight: recvVideo.videoHeight,
      readyState: recvVideo.readyState,
      settings: track && track.getSettings ? track.getSettings() : null,
      constraints: track && track.getConstraints ? track.getConstraints() : null
    });
    startOverlay.style.display = 'none';
    scanning = true;
    setStatus('Scanning', true);
    log('Camera ready — look for QR codes');
    scanLoop();
  } catch (e) {
    debugLog('error', 'camera error', { name: e.name, message: e.message });
    log('Camera error: ' + e.message);
    alert('Camera access denied. Grant permission and try again.');
  }
}

function stopCamera() {
  scanning = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  recvVideo.srcObject = null;
}

let skip = 0;
function scanLoop() {
  if (!scanning) return;
  const ctx = recvCanvas.getContext('2d', { willReadFrequently: true });
  if (recvVideo.readyState >= recvVideo.HAVE_ENOUGH_DATA) {
    recvCanvas.width = recvVideo.videoWidth || 320;
    recvCanvas.height = recvVideo.videoHeight || 240;
    ctx.drawImage(recvVideo, 0, 0);
    const now = Date.now();
    if (now - lastFrameLog > 2000) {
      lastFrameLog = now;
      debugLog('info', 'frame available', {
        videoWidth: recvVideo.videoWidth,
        videoHeight: recvVideo.videoHeight,
        canvasWidth: recvCanvas.width,
        canvasHeight: recvCanvas.height,
        readyState: recvVideo.readyState
      });
    }
    skip = (skip + 1) % 3;
    if (skip === 0) {
      try {
        scanAttempts++;
        const imageData = ctx.getImageData(0, 0, recvCanvas.width, recvCanvas.height);
        if (typeof jsQR !== 'function') {
          debugLog('error', 'jsQR is not loaded', { type: typeof jsQR });
          scanning = false;
          return;
        }
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: 'attemptBoth'
        });
        if (code && code.data) {
          decodeHits++;
          if (code.data !== window.lastDecodedQR) {
            window.lastDecodedQR = code.data;
            debugLog('info', 'jsQR decoded candidate', {
              length: code.data.length,
              location: code.location || null
            });
            processData(code.data);
          }
        } else if (barcodeDetector && !barcodeDetecting) {
          barcodeDetecting = true;
          barcodeDetector.detect(recvCanvas).then(codes => {
            if (codes.length && codes[0].rawValue) {
              decodeHits++;
              if (codes[0].rawValue !== window.lastDecodedQR) {
                window.lastDecodedQR = codes[0].rawValue;
                debugLog('info', 'native BarcodeDetector decoded candidate', {
                  length: codes[0].rawValue.length,
                  format: codes[0].format,
                  boundingBox: codes[0].boundingBox ? {
                    x: Math.round(codes[0].boundingBox.x),
                    y: Math.round(codes[0].boundingBox.y),
                    width: Math.round(codes[0].boundingBox.width),
                    height: Math.round(codes[0].boundingBox.height)
                  } : null
                });
                processData(codes[0].rawValue);
              }
            } else if (Date.now() - lastNoCodeLog > 2000) {
              lastNoCodeLog = Date.now();
              debugLog('info', 'no QR found in recent frames', {
                attempts: scanAttempts,
                errors: scanErrors,
                hits: decodeHits,
                jsQR: 'miss',
                nativeBarcodeDetector: 'miss'
              });
            }
          }).catch(e => {
            scanErrors++;
            debugLog('error', 'native BarcodeDetector exception', { name: e.name, message: e.message });
          }).finally(() => {
            barcodeDetecting = false;
          });
        } else if (Date.now() - lastNoCodeLog > 2000) {
          lastNoCodeLog = Date.now();
          debugLog('info', 'no QR found in recent frames', {
            attempts: scanAttempts,
            errors: scanErrors,
            hits: decodeHits,
            nativeDetectorBusy: true
          });
        }
      } catch (e) {
        scanErrors++;
        debugLog('error', 'scan exception', {
          name: e.name,
          message: e.message,
          stack: e.stack ? e.stack.split('\n').slice(0, 3).join(' | ') : null
        });
        log('Scan error: ' + e.message);
      }
    }
    if (now - lastScanStats > 5000) {
      lastScanStats = now;
      debugLog('info', 'scan stats', {
        attempts: scanAttempts,
        errors: scanErrors,
        hits: decodeHits,
        sessionHash: sessionHash ? sessionHash.slice(0, 12) : null,
        totalChunks,
        contiguousIdx
      });
    }
  } else if (Date.now() - lastFrameLog > 2000) {
    lastFrameLog = Date.now();
    debugLog('warn', 'waiting for enough video data', {
      readyState: recvVideo.readyState,
      videoWidth: recvVideo.videoWidth,
      videoHeight: recvVideo.videoHeight
    });
  }
  animId = requestAnimationFrame(scanLoop);
}
</script>
</body>
</html>
