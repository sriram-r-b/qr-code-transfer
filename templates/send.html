<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Send Data - QR Data Transfer</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0f0f13; color: #e0e0e0; min-height: 100vh;
}
.container { max-width: 860px; margin: 0 auto; padding: 1.5rem; }
.top-bar { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
.back {
  background: #1a1a24; border: 1px solid #2a2a3a; color: #e0e0e0;
  padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer;
  text-decoration: none; font-size: 0.9rem; transition: background 0.2s;
}
.back:hover { background: #2a2a34; }
h1 { font-size: 1.5rem; background: linear-gradient(135deg, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.card { background: #1a1a24; border: 1px solid #2a2a3a; border-radius: 1rem; padding: 1.5rem; margin-bottom: 1.5rem; }
.card-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: #888; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
textarea {
  width: 100%; min-height: 130px; background: #12121c; border: 1px solid #2a2a3a;
  border-radius: 0.5rem; padding: 0.75rem; color: #e0e0e0; font-size: 0.95rem;
  resize: vertical; font-family: inherit; outline: none;
}
textarea:focus { border-color: #6366f1; }
.file-drop {
  border: 2px dashed #2a2a3a; border-radius: 0.5rem; padding: 1.8rem;
  text-align: center; cursor: pointer; transition: all 0.2s; margin-top: 1rem;
}
.file-drop:hover, .file-drop.dragover { border-color: #6366f1; background: rgba(99,102,241,0.05); }
.file-drop input { display: none; }
.file-drop .icon { font-size: 2rem; margin-bottom: 0.5rem; }
.file-drop .info { color: #888; font-size: 0.9rem; }
.btn-row { display: flex; gap: 0.75rem; margin-top: 1rem; flex-wrap: wrap; }
.btn {
  padding: 0.6rem 1.4rem; border-radius: 0.5rem; border: none; cursor: pointer;
  font-size: 0.95rem; font-weight: 600; transition: all 0.2s;
}
.btn-primary { background: #6366f1; color: #fff; }
.btn-primary:hover { background: #5558e6; transform: translateY(-1px); }
.btn-primary:disabled { background: #3a3a5a; cursor: not-allowed; transform: none; }
.btn-secondary { background: #2a2a3a; color: #e0e0e0; }
.btn-secondary:hover { background: #3a3a4a; }
.btn-success { background: #22c55e; color: #fff; }
.btn-success:hover { background: #16a34a; }
.btn-warning { background: #f59e0b; color: #000; }
.btn-warning:hover { background: #d97706; }

.qr-section { text-align: center; }
.qr-wrapper {
  display: inline-block; background: #fff; padding: 1rem;
  border-radius: 0.75rem; margin: 0.75rem 0;
}
.qr-wrapper img { display: block; margin: 0 auto; width: 260px; height: 260px; }

.status-bar {
  display: flex; align-items: center; justify-content: center; gap: 0.75rem;
  margin: 0.75rem 0; flex-wrap: wrap;
}
.status-chip {
  display: inline-flex; align-items: center; gap: 0.4rem;
  padding: 0.35rem 0.9rem; border-radius: 999px; font-size: 0.8rem; font-weight: 600;
}
.status-chip.waiting { background: rgba(99,102,241,0.15); color: #818cf8; }
.status-chip.ackd { background: rgba(34,197,94,0.15); color: #22c55e; }
.status-chip.retry { background: rgba(245,158,11,0.15); color: #f59e0b; }
.status-chip.done { background: rgba(34,197,94,0.2); color: #22c55e; }

.chunks-grid {
  display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin: 0.75rem 0;
}
.chunk-dot {
  width: 28px; height: 28px; border-radius: 6px; background: #2a2a3a;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.65rem; color: #555; transition: all 0.25s; font-weight: 600;
  border: 2px solid transparent;
}
.chunk-dot.pending { background: #2a2a3a; color: #555; }
.chunk-dot.current { background: #6366f1; color: #fff; border-color: #818cf8; transform: scale(1.1); }
.chunk-dot.acked { background: #22c55e; color: #fff; }
.chunk-dot.retry { background: #f59e0b; color: #000; animation: pulse 1s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

.controls { display: flex; align-items: center; justify-content: center; gap: 0.75rem; margin-top: 0.5rem; }
.controls button {
  padding: 0.5rem 1rem; border-radius: 0.5rem; border: 1px solid #2a2a3a;
  background: #1a1a24; color: #e0e0e0; cursor: pointer; font-size: 0.85rem;
  transition: all 0.2s;
}
.controls button:hover { background: #2a2a3a; border-color: #6366f1; }
.controls button:disabled { opacity: 0.3; cursor: not-allowed; }

.log-section { max-height: 100px; overflow-y: auto; font-family: monospace; font-size: 0.78rem; margin-top: 0.75rem; }
.log-entry { padding: 2px 0; color: #888; }
.log-entry.info { color: #818cf8; }
.log-entry.success { color: #22c55e; }
.log-entry.error { color: #ef4444; }
.log-entry.warn { color: #f59e0b; }

.hash-display { font-family: monospace; font-size: 0.75rem; color: #666; word-break: break-all; margin-top: 0.5rem; }
.file-info { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; background: #12121c; border-radius: 0.5rem; margin-top: 0.5rem; }
.file-info .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-info .size { color: #888; font-size: 0.85rem; }
.file-info .remove { cursor: pointer; color: #ef4444; font-size: 1.2rem; line-height: 1; }
.hidden { display: none !important; }
.session-badge {
  background: #12121c; border: 1px solid #2a2a3a; border-radius: 0.5rem;
  padding: 0.4rem 0.8rem; font-family: monospace; font-size: 0.8rem; color: #888;
  cursor: pointer; user-select: all;
}
.server-url { text-align: center; font-size: 0.85rem; color: #666; margin-bottom: 0.5rem; }
</style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <a href="/" class="back">&larr; Back</a>
    <h1>Send Data</h1>
    <span class="session-badge hidden" id="sessionBadge"></span>
  </div>

  <div class="card" id="inputCard">
    <div class="card-title">Input</div>
    <textarea id="dataInput" placeholder="Type or paste text data here..."></textarea>
    <div class="file-drop" id="fileDrop">
      <div class="icon">&#128206;</div>
      <div class="info">Drop a file here, or click to browse</div>
      <input type="file" id="fileInput">
    </div>
    <div id="fileInfo" class="file-info hidden">
      <span>&#128196;</span>
      <span class="name" id="fileName"></span>
      <span class="size" id="fileSize"></span>
      <span class="remove" id="removeFile">&times;</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="generateBtn">Generate QR Codes</button>
      <button class="btn btn-secondary" id="clearBtn">Clear</button>
    </div>
  </div>

  <div class="card hidden" id="transferCard">
    <div class="card-title">
      <span>Transfer</span>
      <span id="transferStatus" class="status-chip waiting">WAITING</span>
    </div>
    <div class="server-url" id="serverUrl"></div>
    <div class="qr-section">
      <div class="qr-wrapper" id="qrWrapper">
        <img id="qrImage" src="" alt="QR Code">
      </div>
    </div>
    <div class="chunks-grid" id="chunksGrid"></div>
    <div class="controls">
      <button id="skipBtn" title="Skip to next unacked chunk (if receiver missed it)">Skip &rarr;</button>
      <button id="resetTransferBtn" class="btn-warning">Reset Transfer</button>
    </div>
    <div class="log-section" id="logSection"></div>
    <div class="hash-display" id="hashDisplay"></div>
  </div>
</div>

<script>
const dataInput = document.getElementById('dataInput');
const fileDrop = document.getElementById('fileDrop');
const fileInput = document.getElementById('fileInput');
const fileInfo = document.getElementById('fileInfo');
const fileName = document.getElementById('fileName');
const fileSize = document.getElementById('fileSize');
const removeFile = document.getElementById('removeFile');
const generateBtn = document.getElementById('generateBtn');
const clearBtn = document.getElementById('clearBtn');
const inputCard = document.getElementById('inputCard');
const transferCard = document.getElementById('transferCard');
const qrImage = document.getElementById('qrImage');
const chunksGrid = document.getElementById('chunksGrid');
const transferStatus = document.getElementById('transferStatus');
const serverUrl = document.getElementById('serverUrl');
const sessionBadge = document.getElementById('sessionBadge');
const hashDisplay = document.getElementById('hashDisplay');
const logSection = document.getElementById('logSection');
const skipBtn = document.getElementById('skipBtn');
const resetTransferBtn = document.getElementById('resetTransferBtn');

let sessionId = null;
let chunks = [];
let currentIndex = 0;
let pollInterval = null;
let selectedFile = null;

// --- Helpers ---
function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function addLog(msg, type = 'info') {
  const entry = document.createElement('div');
  entry.className = 'log-entry ' + type;
  const time = new Date().toLocaleTimeString();
  entry.textContent = '[' + time + '] ' + msg;
  logSection.appendChild(entry);
  logSection.scrollTop = logSection.scrollHeight;
}

function setStatus(text, cls = 'waiting') {
  transferStatus.textContent = text;
  transferStatus.className = 'status-chip ' + cls;
}

// --- File handling ---
fileDrop.addEventListener('click', () => fileInput.click());
fileDrop.addEventListener('dragover', (e) => { e.preventDefault(); fileDrop.classList.add('dragover'); });
fileDrop.addEventListener('dragleave', () => fileDrop.classList.remove('dragover'));
fileDrop.addEventListener('drop', (e) => {
  e.preventDefault(); fileDrop.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFile(fileInput.files[0]); });

function handleFile(file) {
  selectedFile = file;
  fileName.textContent = file.name;
  fileSize.textContent = formatSize(file.size);
  fileInfo.classList.remove('hidden');
  dataInput.value = '';
}

removeFile.addEventListener('click', () => {
  selectedFile = null;
  fileInfo.classList.add('hidden');
  fileInput.value = '';
});

clearBtn.addEventListener('click', () => {
  dataInput.value = '';
  selectedFile = null;
  fileInfo.classList.add('hidden');
  fileInput.value = '';
  stopTransfer();
});

// --- Session creation ---
generateBtn.addEventListener('click', async () => {
  const text = dataInput.value.trim();
  if (!text && !selectedFile) { addLog('Enter text or select a file first.', 'warn'); return; }

  generateBtn.disabled = true;
  generateBtn.textContent = 'Generating...';
  addLog('Chunking data...', 'info');

  try {
    let payload;
    if (selectedFile) {
      const buf = await selectedFile.arrayBuffer();
      const bytes = new Uint8Array(buf);
      const b64 = btoa(String.fromCharCode(...bytes));
      payload = { data: b64, is_file: true, filename: selectedFile.name };
    } else {
      payload = { data: text, is_file: false, filename: '' };
    }

    const resp = await fetch('/api/session/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const result = await resp.json();

    if (!result.sid) throw new Error(result.error || 'Failed to create session');

    sessionId = result.sid;
    chunks = result.chunks;

    inputCard.classList.add('hidden');
    transferCard.classList.remove('hidden');
    sessionBadge.textContent = sessionId;
    sessionBadge.classList.remove('hidden');

    const loc = window.location;
    serverUrl.textContent = 'Receiver: open ' + loc.origin + '/receive on the other device';
    hashDisplay.textContent = 'MD5: ' + result.data_hash + ' | ' + chunks.length + ' chunks';

    currentIndex = 0;
    renderGrid();
    await displayQR(currentIndex);
    setStatus('Waiting for receiver...', 'waiting');
    addLog('Session created: ' + sessionId, 'success');
    addLog('Total: ' + chunks.length + ' chunks (' + formatSize(result.total_size) + ')', 'info');

    startPolling();
  } catch (err) {
    addLog('Error: ' + err.message, 'error');
    setStatus('ERROR', 'waiting');
  } finally {
    generateBtn.disabled = false;
    generateBtn.textContent = 'Generate QR Codes';
  }
});

// --- QR display ---
async function displayQR(index) {
  if (!chunks.length) return;
  qrImage.style.opacity = '0.4';
  try {
    const resp = await fetch('/api/qr', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chunk: chunks[index], sid: sessionId, box_size: 6, border: 2 }),
    });
    const result = await resp.json();
    qrImage.src = 'data:image/png;base64,' + result.qr;
    qrImage.style.opacity = '1';
    updateGrid(index);
  } catch (err) {
    addLog('QR gen error for chunk ' + index + ': ' + err.message, 'error');
  }
}

// --- Grid ---
function renderGrid() {
  chunksGrid.innerHTML = '';
  for (let i = 0; i < chunks.length; i++) {
    const dot = document.createElement('div');
    dot.className = 'chunk-dot pending';
    dot.id = 'cd-' + i;
    dot.textContent = i + 1;
    chunksGrid.appendChild(dot);
  }
}

function updateGrid(activeIdx) {
  for (let i = 0; i < chunks.length; i++) {
    const dot = document.getElementById('cd-' + i);
    dot.classList.remove('current', 'acked', 'retry', 'pending');
    dot.classList.add('pending');
  }
  const active = document.getElementById('cd-' + activeIdx);
  if (active) active.classList.replace('pending', 'current');
}

function markAcked(index) {
  const dot = document.getElementById('cd-' + index);
  if (dot) {
    dot.classList.remove('current', 'retry', 'pending');
    dot.classList.add('acked');
  }
}

function markRetry(index) {
  const dot = document.getElementById('cd-' + index);
  if (dot) {
    dot.classList.remove('current', 'acked', 'pending');
    dot.classList.add('retry');
  }
}

// --- Polling ---
function startPolling() {
  pollInterval = setInterval(pollStatus, 500);
}

function stopPolling() {
  if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
}

async function pollStatus() {
  if (!sessionId || !chunks.length) return;
  try {
    const resp = await fetch('/api/session/' + sessionId + '/status');
    if (!resp.ok) {
      const err = await resp.json();
      if (err.expired) {
        addLog('Session expired — generate again', 'error');
        stopPolling();
        return;
      }
      return;
    }
    const status = await resp.json();

    if (status.complete) {
      setStatus('Complete! All ' + chunks.length + ' chunks received', 'done');
      stopPolling();
      addLog('All chunks acknowledged by receiver!', 'success');
      return;
    }

    // Update acked dots
    status.acked.forEach(idx => markAcked(idx));

    // Check for retry requests
    if (status.retry_requested.length > 0) {
      const target = status.retry_requested[0];
      status.retry_requested.forEach(idx => markRetry(idx));
      if (target !== currentIndex) {
        currentIndex = target;
        await displayQR(currentIndex);
        setStatus('Retry: chunk ' + (target + 1), 'retry');
        addLog('Receiver missed chunk ' + (target + 1) + ' — resending', 'warn');
      }
      return;
    }

    // Normal advancement: if current chunk is acked, move to next unacked
    if (status.acked.includes(currentIndex)) {
      markAcked(currentIndex);
      // Find next unacked chunk
      const unacked = [];
      for (let i = 0; i < chunks.length; i++) {
        if (!status.acked.includes(i)) unacked.push(i);
      }
      if (unacked.length > 0) {
        currentIndex = unacked[0];
        await displayQR(currentIndex);
        const pct = Math.round(status.acked.length / chunks.length * 100);
        setStatus('Sent ' + status.acked.length + '/' + chunks.length + ' (' + pct + '%)', 'ackd');
        addLog('Chunk ' + (currentIndex) + ' sent (advancing)', 'success');
      }
    } else {
      // Still waiting for ACK on current chunk
      const waitTime = Math.round(status.acked.length / chunks.length * 100);
      setStatus('Waiting for chunk ' + (currentIndex + 1) + ' (' + waitTime + '%)', 'waiting');
    }
  } catch (err) {
    // silent
  }
}

// --- Controls ---
skipBtn.addEventListener('click', async () => {
  if (!sessionId) return;
  try {
    const resp = await fetch('/api/session/' + sessionId + '/status');
    const status = await resp.json();
    const unacked = [];
    for (let i = 0; i < chunks.length; i++) {
      if (!status.acked.includes(i)) unacked.push(i);
    }
    if (unacked.length > 0 && unacked[0] !== currentIndex) {
      currentIndex = unacked[0];
      await displayQR(currentIndex);
      addLog('Manually skipped to chunk ' + (currentIndex + 1), 'info');
    }
  } catch {}
});

resetTransferBtn.addEventListener('click', () => {
  stopTransfer();
  inputCard.classList.remove('hidden');
  transferCard.classList.add('hidden');
});

function stopTransfer() {
  stopPolling();
  sessionId = null;
  chunks = [];
  currentIndex = 0;
  logSection.innerHTML = '';
}
</script>
</body>
</html>
