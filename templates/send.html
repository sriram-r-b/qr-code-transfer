<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Send Data - QR Data Transfer</title>
<script src="/static/qrcode.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f13; color: #e0e0e0; height: 100vh; overflow: hidden; }
.container { height: 100vh; display: flex; flex-direction: column; }
.top-bar { display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1.5rem; background: #1a1a24; border-bottom: 1px solid #2a2a3a; }
.back { background: #2a2a3a; border: none; color: #e0e0e0; padding: 0.4rem 0.8rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
.back:hover { background: #3a3a4a; }
h1 { font-size: 1.2rem; background: linear-gradient(135deg, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.status { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; display: none; }
.status-dot.active { display: block; animation: blink 1.2s infinite; }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

.main { flex: 1; display: flex; overflow: hidden; }
.panel-left { width: 30%; min-width: 260px; display: flex; flex-direction: column; border-right: 1px solid #2a2a3a; }
.panel-right { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; }

.camera-box { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; background: #0a0a0f; position: relative; }
.camera-box .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: #666; margin-bottom: 0.5rem; }
.video-wrapper { position: relative; width: 100%; max-width: 280px; border-radius: 0.5rem; overflow: hidden; background: #000; }
#pipVideo { width: 100%; display: block; transform: scaleX(-1); }
#pipCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; }
.pip-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; border: 2px solid rgba(99,102,241,0.3); border-radius: 0.5rem; pointer-events: none; }
.pip-overlay.has-ack { border-color: rgba(34,197,94,0.6); }

.input-panel { padding: 0.75rem; border-top: 1px solid #2a2a3a; background: #15151e; }
.input-panel textarea { width: 100%; min-height: 60px; background: #12121c; border: 1px solid #2a2a3a; border-radius: 0.35rem; padding: 0.4rem; color: #e0e0e0; font-size: 0.8rem; resize: vertical; font-family: inherit; outline: none; margin-bottom: 0.4rem; }
.input-panel textarea:focus { border-color: #6366f1; }
.input-row { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.btn { padding: 0.35rem 0.8rem; border-radius: 0.35rem; border: none; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: all 0.15s; }
.btn-primary { background: #6366f1; color: #fff; }
.btn-primary:hover { background: #5558e6; }
.btn-primary:disabled { background: #3a3a5a; cursor: not-allowed; }
.btn-secondary { background: #2a2a3a; color: #e0e0e0; }
.btn-secondary:hover { background: #3a3a4a; }
.btn-small { font-size: 0.7rem; padding: 0.25rem 0.5rem; }
.file-label { font-size: 0.7rem; color: #888; padding: 0.25rem 0.5rem; background: #2a2a3a; border-radius: 0.25rem; cursor: pointer; }
.file-label:hover { background: #3a3a4a; }
#fileInput { display: none; }
.file-badge { font-size: 0.7rem; color: #22c55e; }

.qr-container { display: flex; flex-direction: column; align-items: center; }
.qr-wrapper { background: #fff; padding: 0.75rem; border-radius: 0.75rem; }
#qrcode img, #qrcode canvas { display: block; width: 280px; height: 280px; }
.chunk-info { margin-top: 0.75rem; text-align: center; }
.chunk-idx { font-size: 1.1rem; font-weight: 700; }
.chunk-total { font-size: 0.8rem; color: #888; }
.hash-row { margin-top: 0.35rem; font-family: monospace; font-size: 0.6rem; color: #555; word-break: break-all; max-width: 400px; }

.chunk-dots { display: flex; gap: 3px; justify-content: center; flex-wrap: wrap; margin-top: 0.75rem; padding: 0 1rem; max-width: 400px; }
.cdot { width: 14px; height: 14px; border-radius: 3px; background: #2a2a3a; transition: background 0.2s; }
.cdot.acked { background: #22c55e; }
.cdot.current { background: #6366f1; }

.hidden { display: none !important; }

/* input mode card */
.input-mode { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
.input-mode textarea { width: 100%; max-width: 500px; min-height: 120px; margin-bottom: 1rem; }
.input-mode .btn-row { display: flex; gap: 0.75rem; }
</style>
</head>
<body>
<div class="container" id="sendMode">
  <div class="top-bar">
    <a href="/" class="back">&larr; Back</a>
    <h1>Send Data</h1>
    <div class="status">
      <span id="statusText">Ready</span>
      <span class="status-dot" id="ackDot"></span>
    </div>
  </div>
  <div class="main">
    <div class="panel-left">
      <div class="camera-box">
        <div class="label">ACK Scanner</div>
        <div class="video-wrapper">
          <video id="pipVideo" autoplay playsinline muted></video>
          <canvas id="pipCanvas"></canvas>
          <div class="pip-overlay" id="pipOverlay"></div>
        </div>
        <button class="btn btn-secondary btn-small" id="toggleCamBtn" style="margin-top:0.4rem;">&#9654; Start Camera</button>
      </div>
      <div class="input-panel">
        <textarea id="dataInput" placeholder="Type or paste text..."></textarea>
        <div class="input-row">
          <button class="btn btn-primary btn-small" id="generateBtn">Generate</button>
          <label class="file-label" id="fileLabel">&#128206; File</label>
          <input type="file" id="fileInput">
          <span class="file-badge hidden" id="fileBadge"></span>
          <button class="btn btn-secondary btn-small" id="clearBtn">Clear</button>
        </div>
      </div>
    </div>
    <div class="panel-right">
      <div class="qr-container">
        <div class="qr-wrapper" id="qrWrapper">
          <div id="qrcode"></div>
        </div>
        <div class="chunk-info">
          <div class="chunk-idx" id="chunkIdx">-</div>
          <div class="chunk-total" id="chunkTotal">-</div>
        </div>
        <div class="hash-row" id="hashDisplay"></div>
        <div class="chunk-dots" id="chunkDots"></div>
      </div>
    </div>
  </div>
</div>

<script>
const CHUNK_SIZE = 500;

const dataInput = document.getElementById('dataInput');
const generateBtn = document.getElementById('generateBtn');
const clearBtn = document.getElementById('clearBtn');
const fileInput = document.getElementById('fileInput');
const fileLabel = document.getElementById('fileLabel');
const fileBadge = document.getElementById('fileBadge');
const qrcodeEl = document.getElementById('qrcode');
const chunkIdx = document.getElementById('chunkIdx');
const chunkTotal = document.getElementById('chunkTotal');
const hashDisplay = document.getElementById('hashDisplay');
const chunkDots = document.getElementById('chunkDots');
const statusText = document.getElementById('statusText');
const ackDot = document.getElementById('ackDot');

const pipVideo = document.getElementById('pipVideo');
const pipCanvas = document.getElementById('pipCanvas');
const pipOverlay = document.getElementById('pipOverlay');
const toggleCamBtn = document.getElementById('toggleCamBtn');

let qr = null;
let chunks = [];
let sessionHash = '';
let displayedIndex = 0;
let lastAcked = -1;
let totalChunks = 0;
let cameraStream = null;
let scanning = false;
let animId = null;
let selectedFile = null;
let lastAckTime = 0;
let resendTimer = null;

// ---- Input handling ----
fileLabel.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) {
    selectedFile = fileInput.files[0];
    fileBadge.textContent = selectedFile.name;
    fileBadge.classList.remove('hidden');
    dataInput.value = '';
  }
});

clearBtn.addEventListener('click', () => {
  dataInput.value = '';
  selectedFile = null;
  fileBadge.classList.add('hidden');
  fileInput.value = '';
});

// ---- SHA-256 ----
async function sha256(data) {
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// ---- Chunking ----
async function prepareData(text, file) {
  let bytes;
  if (file) {
    const buf = await file.arrayBuffer();
    bytes = new Uint8Array(buf);
  } else {
    bytes = new TextEncoder().encode(text);
  }
  const hash = await sha256(bytes);
  const chunks = [];
  for (let i = 0; i < bytes.length; i += CHUNK_SIZE) {
    const slice = bytes.slice(i, Math.min(i + CHUNK_SIZE, bytes.length));
    const b64 = btoa(String.fromCharCode(...slice));
    chunks.push({ i: chunks.length, d: b64 });
  }
  return { chunks, hash, totalSize: bytes.length };
}

// ---- QR generation ----
function initQR() {
  qrcodeEl.innerHTML = '';
  qr = new QRCode(qrcodeEl, {
    width: 280, height: 280,
    colorDark: '#000000',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });
}

function showChunk(index) {
  if (!chunks.length || !qr) return;
  const c = chunks[index];
  const payload = JSON.stringify({
    v: 1, t: 'd', i: c.i, n: totalChunks, h: sessionHash, d: c.d
  });
  qr.clear();
  qr.makeCode(payload);

  displayedIndex = index;
  chunkIdx.textContent = 'Chunk ' + (index + 1);
  chunkTotal.textContent = 'of ' + totalChunks;
  updateDots(index);
  statusText.textContent = 'Showing chunk ' + (index + 1);
}

function updateDots(active) {
  chunkDots.innerHTML = '';
  for (let i = 0; i < totalChunks; i++) {
    const d = document.createElement('div');
    d.className = 'cdot';
    if (i < lastAcked + 1) d.classList.add('acked');
    if (i === active) d.classList.add('current');
    chunkDots.appendChild(d);
  }
}

// ---- ACK processing ----
function processACK(data) {
  let msg;
  try { msg = JSON.parse(data); } catch { return; }
  if (msg.v !== 1 || msg.t !== 'a' || msg.h !== sessionHash) return;
  if (msg.i === undefined) return;

  if (msg.i > lastAcked) {
    lastAcked = msg.i;
    lastAckTime = Date.now();
    pipOverlay.classList.add('has-ack');
    setTimeout(() => pipOverlay.classList.remove('has-ack'), 200);

    ackDot.classList.add('active');
    statusText.textContent = 'ACK ' + (lastAcked + 1) + '/' + totalChunks;
    clearResendTimer();

    if (lastAcked >= totalChunks - 1) {
      statusText.textContent = 'Complete!';
      ackDot.classList.remove('active');
      return;
    }

    const next = lastAcked + 1;
    if (next !== displayedIndex) {
      showChunk(next);
      startResendTimer();
    }
  }
}

function startResendTimer() {
  clearResendTimer();
  resendTimer = setInterval(() => {
    if (lastAcked >= totalChunks - 1) { clearResendTimer(); return; }
    const idle = Date.now() - lastAckTime;
    if (idle > 6000) {
      statusText.textContent = 'Resending chunk ' + (displayedIndex + 1) + '...';
      showChunk(displayedIndex);
    }
  }, 3000);
}

function clearResendTimer() {
  if (resendTimer) { clearInterval(resendTimer); resendTimer = null; }
}

// ---- Camera (ACK listener) ----
toggleCamBtn.addEventListener('click', async () => {
  if (cameraStream) { stopCamera(); return; }
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
    });
    pipVideo.srcObject = cameraStream;
    await pipVideo.play();
    scanning = true;
    toggleCamBtn.textContent = 'Stop Camera';
    statusText.textContent = 'Camera active';
    scanLoop();
  } catch (e) {
    statusText.textContent = 'Camera error: ' + e.message;
  }
});

function stopCamera() {
  scanning = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
  pipVideo.srcObject = null;
  toggleCamBtn.textContent = 'Start Camera';
}

let frameSkip = 0;
function scanLoop() {
  if (!scanning) return;
  const ctx = pipCanvas.getContext('2d', { willReadFrequently: true });
  if (pipVideo.readyState >= pipVideo.HAVE_ENOUGH_DATA) {
    pipCanvas.width = pipVideo.videoWidth || 160;
    pipCanvas.height = pipVideo.videoHeight || 120;
    ctx.drawImage(pipVideo, 0, 0);
    frameSkip = (frameSkip + 1) % 3;
    if (frameSkip === 0) {
      try {
        const imageData = ctx.getImageData(0, 0, pipCanvas.width, pipCanvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
        if (code && code.data) processACK(code.data);
      } catch {}
    }
  }
  animId = requestAnimationFrame(scanLoop);
}

// ---- Generate ----
generateBtn.addEventListener('click', async () => {
  const text = dataInput.value.trim();
  if (!text && !selectedFile) { statusText.textContent = 'Enter text or select a file'; return; }

  generateBtn.disabled = true;
  generateBtn.textContent = 'Preparing...';

  try {
    const { chunks: c, hash, totalSize } = await prepareData(text, selectedFile);
    if (!c.length) throw new Error('No data');

    chunks = c;
    sessionHash = hash;
    totalChunks = c.length;
    lastAcked = -1;
    hashDisplay.textContent = 'Hash: ' + hash.slice(0, 16) + '... | Size: ' + totalSize + 'B';

    initQR();
    lastAckTime = Date.now();
    showChunk(0);
    startResendTimer();

    statusText.textContent = 'Ready — waiting for receiver ACK';
    if (!cameraStream) toggleCamBtn.click();
  } catch (e) {
    statusText.textContent = 'Error: ' + e.message;
  }

  generateBtn.disabled = false;
  generateBtn.textContent = 'Generate';
});
</script>
<script src="/static/jsqr.js"></script>
</body>
</html>
